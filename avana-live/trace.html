<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Avana — Live Session Traces</title>
<style>
  :root{--bg:#0e141b;--panel:#151f2b;--panel2:#1b2836;--line:#27384a;--ink:#e8eef5;--muted:#8ba0b6;
    --user:#274156;--asst:#1c2a3a;--human:#2d234a;--tool:#15242c;--accent:#5eb0ef;--green:#7bd389;--violet:#c79bf0;--red:#f2778f;}
  *{box-sizing:border-box}
  body{margin:0;font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;height:100vh;overflow:hidden}
  aside{width:300px;flex:none;border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
  aside h1{font-size:14px;margin:0;padding:16px 16px 4px}
  aside .sub{padding:0 16px 12px;color:var(--muted);font-size:12px}
  .trace-item{padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
  .trace-item:hover,.trace-item.active{background:var(--panel2)}
  .trace-item.active{box-shadow:inset 3px 0 0 var(--accent)}
  .trace-item .sc{font-weight:600;font-size:13.5px}
  .trace-item .pe{color:var(--muted);font-size:12px;font-family:ui-monospace,Menlo,monospace}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted);margin-right:5px}
  main{flex:1;overflow:auto}
  .topbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 26px;z-index:5}
  .topbar h2{margin:0 0 4px;font-size:18px}
  .topbar .ids{color:var(--muted);font-size:12px;font-family:ui-monospace,Menlo,monospace}
  .topbar .right{float:right;display:flex;gap:6px;align-items:center}
  .btn{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--ink)}
  .btn.on{background:var(--accent);color:#0d1620;border-color:var(--accent)}
  /* labeling panel */
  .label-bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .label-bar .lrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .label-bar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:4px}
  .lb{font-size:13px;padding:6px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
  .lb.pass.sel{background:var(--green);color:#0d1620;border-color:var(--green)}
  .lb.fail.sel{background:var(--red);color:#0d1620;border-color:var(--red)}
  .label-bar textarea{width:100%;margin-top:10px;background:#0c141b;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:13px/1.5 inherit;min-height:62px;resize:vertical}
  .label-bar .save{background:var(--accent);color:#0d1620;border-color:var(--accent);font-weight:600}
  .label-bar .status{color:var(--muted);font-size:12px;margin-left:6px}
  .label-bar .suggest{font-size:12px;color:var(--muted);margin-top:9px}
  .label-bar .suggest b{color:var(--ink)}
  .label-bar .link{color:var(--accent);cursor:pointer;text-decoration:underline}
  .tag.edit{background:var(--panel2)}
  .tag .tagx{cursor:pointer;margin-left:6px;color:var(--muted);font-weight:700}
  .tag .tagx:hover{color:var(--red)}
  .taginput{background:#0c141b;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 9px;font:12px/1.4 inherit;width:150px}
  .taginput:focus{outline:none;border-color:var(--accent)}
  /* judge-eval grid */
  .evalhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
  .evaltable{width:100%;border-collapse:collapse;font-size:13.5px}
  .evaltable th,.evaltable td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  .evaltable th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .evid{color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,monospace;margin-top:2px}
  .evrow.ok{background:rgba(123,211,137,.13)}                 /* match — green */
  .evrow.bad{background:rgba(242,119,143,.20)}                /* mismatch — red, highlighted */
  .evrow.bad td{color:#fff}
  .evrow td.evmatch{font-weight:600;white-space:nowrap}
  .evaltable td{vertical-align:top}
  .evreason{color:var(--muted);font-size:11.5px;line-height:1.45;margin-top:4px;max-width:340px;white-space:normal}
  .evrow.bad td .evreason{color:#f6dbe1}
  .vpass{color:var(--green);font-weight:600} .vfail{color:var(--red);font-weight:600} .vwait{color:var(--muted)}
  .verdot{font-weight:700;margin-right:6px}
  .verdot.pass{color:var(--green)} .verdot.fail{color:var(--red)} .verdot.none{color:var(--muted)}
  .badge{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .wrap{max-width:880px;padding:20px 26px 80px}
  /* mega judge eval */
  .wrap.wide{max-width:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 10px;cursor:pointer;color:var(--muted);user-select:none}
  .chip.on{border-color:var(--accent);color:var(--ink);background:var(--panel2)}
  .chip input{margin:0 3px 0 0;vertical-align:-1px}
  .chip .kind{font-size:10.5px;color:var(--muted);margin-left:3px}
  .sb,.mega{border-collapse:collapse;font-size:12.5px;margin-bottom:16px}
  .sb th,.sb td,.mega th,.mega td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  .sb th,.mega th{color:var(--muted);font-size:11px;font-weight:600;position:sticky;top:0;background:var(--bg)}
  .sb td.sbl,.mega td.tn{text-align:left;color:var(--muted)}
  .sb td{font-family:ui-monospace,Menlo,monospace}
  .sb .q{font-size:10px;opacity:.6}
  .mega td.tn{max-width:260px;overflow:hidden;text-overflow:ellipsis;font-size:12px}
  .mega td.tn b{color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-weight:600}
  .mega td.mc{cursor:pointer;font-weight:700;min-width:64px;color:var(--muted)}
  .mega td.mc.ok{background:rgba(123,211,137,.16);color:var(--green)}
  .mega td.mc.bad{background:rgba(242,119,143,.24);color:#fff}
  .mega td.mc.err{color:#f5c26b}
  .mega td.mc.sel{outline:2px solid var(--accent);outline-offset:-2px}
  .mega td.mc .ms{display:block;font-weight:400;font-size:10px;color:var(--muted)}
  .replay{background:#2a2410;border:1px solid #6b5a1e;color:#f5d98a;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12.5px}
  .insp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:30px}
  .insph{font-size:13px;margin-bottom:8px}
  .insph .x{float:right;cursor:pointer;color:var(--muted)}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .panes pre{max-height:420px;white-space:pre-wrap;word-break:break-word}
  .seclbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:4px 0 3px}

  .empty{color:var(--muted);padding:40px 26px;max-width:680px}
  .empty code,.empty pre{background:var(--panel);padding:2px 6px;border-radius:5px}
  .context{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px}
  .context .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
  .ev{display:grid;grid-template-columns:78px 1fr;gap:14px;padding:7px 0}
  .ts{color:var(--muted);font-size:11.5px;font-family:ui-monospace,Menlo,monospace;text-align:right;padding-top:9px;white-space:nowrap}
  .bubble{border-radius:12px;padding:10px 14px;border:1px solid var(--line);white-space:pre-wrap}
  .role{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}
  .b-user{background:var(--user)} .b-asst{background:var(--asst)} .b-human{background:var(--human);border-color:#4a3a72}
  .bubble code{background:#0c141b;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font:12.5px ui-monospace,Menlo,monospace}
  .bubble strong{color:#fff}
  .tool{background:var(--tool);border:1px solid #28505a;border-radius:10px;overflow:hidden}
  .tool summary{cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:8px;list-style:none;font-size:13px}
  .tool summary::-webkit-details-marker{display:none}
  .tool .fn{font-family:ui-monospace,Menlo,monospace;color:#7fd9e6;font-weight:600}
  .tool .lat{margin-left:auto;color:var(--muted);font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
  .tool .body{padding:0 12px 12px}
  .tool .seclbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 3px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--green)}
  pre{margin:0;background:#0c141b;border:1px solid var(--line);border-radius:8px;padding:9px 11px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:#cfe1f0}
  .sys{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:12px}
  .sys::before,.sys::after{content:"";flex:1;height:1px;background:var(--line)}
  .sys.handoff{color:var(--violet)} .sys.handoff::before,.sys.handoff::after{background:#4a3a72}
</style>
</head>
<body>
<aside id="side"><h1>🩺 Avana — Live Traces</h1><div class="sub" id="sideSub"></div></aside>
<main>
  <div class="topbar"><div class="right">
    <span class="badge" id="builtBadge"></span>
    <select class="btn" id="sourceSel" title="Data source" style="display:none"></select>
    <button class="btn" id="reloadBtn">↻ Reload</button>
    <button class="btn" id="togglePatient">Patient view</button>
    <button class="btn" id="toggleRaw">View raw JSON</button>
    <button class="btn" id="toggleEval">⚖ Judge eval</button></div>
    <h2 id="scTitle">—</h2><div class="ids" id="scIds"></div></div>
  <div class="wrap" id="wrap"></div>
</main>

<!-- file:// fallback data (generated by: python3 tools/avana.py view).
     When served via tools/serve.py, fresh data is fetched from /data instead. -->
<script src="logs/_view.js"></script>
<script>
(function(){
  "use strict";
  var side = document.getElementById('side');
  var wrap = document.getElementById('wrap');
  var served = location.protocol.indexOf('http') === 0;  // running under serve.py?
  var currentSource = '';   // which data folder we're viewing (set from /sources)
  var timeOnly = function(iso){ return String(iso).slice(11,19); };
  var esc = function(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); };
  // minimal markdown for chat bubbles: **bold** and `code` (text is escaped first)
  var md = function(s){
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/`([^`]+)`/g,'<code>$1</code>');
  };

  // Reload: under the server, re-fetch /data (which rebuilds from the logs).
  // On file://, just reload the page (re-reads logs/_view.js).
  document.getElementById('reloadBtn').onclick = function(){
    if(served){ load(); } else { location.reload(); }
  };

  var srcQuery = function(){ return currentSource ? ('?source=' + encodeURIComponent(currentSource)) : ''; };

  function load(){
    if(served){
      wrap.innerHTML = '<div class="empty">Loading…</div>';
      fetch('/data' + srcQuery(), {cache:'no-store'})
        .then(function(r){ return r.json(); })
        .then(function(d){ start(d.traces || [], d.built); })
        .catch(function(e){ wrap.innerHTML = '<div class="empty">Error fetching /data: ' + esc(e) + '</div>'; });
    } else {
      start((window.TRACES || []), window.__BUILT);
    }
  }

  // Populate the source dropdown from /sources, then load the first one.
  function initSources(){
    var sel = document.getElementById('sourceSel');
    if(!served){ load(); return; }   // file:// has no server-side sources
    fetch('/sources', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var srcs = (d && d.sources) || [];
        if(srcs.length <= 1){ if(srcs.length) currentSource = srcs[0].id; load(); return; }
        sel.innerHTML = srcs.map(function(s){
          return '<option value="' + esc(s.id) + '">' + esc(s.label) + ' (' + (s.count||0) + ')</option>';
        }).join('');
        currentSource = srcs[0].id;
        sel.style.display = '';
        sel.onchange = function(){ currentSource = sel.value; load(); };
        load();
      })
      .catch(function(){ load(); });   // fall back to the default source
  }

  function start(T, built){
    T = (T || []).slice();
    // chronological safety: sort each trace's events by timestamp
    T.forEach(function(tr){ if(tr && tr.events) tr.events.sort(function(a,b){return (a.t||"")<(b.t||"")?-1:1;}); });

    document.querySelectorAll('.trace-item').forEach(function(e){ e.remove(); });  // idempotent on reload
    document.getElementById('builtBadge').textContent =
      built ? ('data built ' + String(built).slice(11,19) + (served ? ' · live' : '')) : 'no build timestamp';

  if(!T.length){
    document.getElementById('sideSub').textContent = 'no sessions yet';
    document.getElementById('scTitle').textContent = 'No traces yet';
    wrap.innerHTML = '<div class="empty"><p>Chat with Avana in Claude Code (launched inside <code>avana-live/</code>), then ' +
      (served ? 'click <b>↻ Reload</b> above.' : 'build the view from a separate terminal:</p><pre>python3 tools/avana.py view</pre><p>…then click <b>↻ Reload</b>.') + '</p></div>';
    return;
  }

  document.getElementById('sideSub').textContent = T.length + ' session(s) · click to inspect';
  T.forEach(function(tr,i){
    var el = document.createElement('div');
    el.className = 'trace-item' + (i===T.length-1 ? ' active' : '');
    el.innerHTML = '<div class="sc">' + verdotHTML(tr) + esc(tr.scenario) + '</div><div class="pe">' + esc(tr.trace_id) + '</div>'
      + '<div style="margin-top:7px" id="sidetags-' + esc(tr.trace_id) + '">' + tagSpans(tagsFor(tr)) + '</div>';
    el.onclick = function(){
      if(evalMode){ evalMode=false; wrap.classList.remove('wide'); if(evalBtn) evalBtn.classList.remove('on'); }  // leave the eval grid
      var items = document.querySelectorAll('.trace-item');
      for(var k=0;k<items.length;k++) items[k].classList.remove('active');
      el.classList.add('active');
      render(tr);
    };
    side.appendChild(el);
  });

  var rawMode = false;
  var patientView = false;   // when true, show only the patient <-> agent conversation
  var current = T[T.length-1];   // newest by default
  var rawBtn = document.getElementById('toggleRaw');
  var patientBtn = document.getElementById('togglePatient');
  rawBtn.onclick = function(){
    rawMode = !rawMode;
    this.textContent = rawMode ? 'View timeline' : 'View raw JSON';
    render(current);
  };
  patientBtn.onclick = function(){
    patientView = !patientView;
    patientBtn.classList.toggle('on', patientView);
    patientBtn.textContent = patientView ? 'Full trace' : 'Patient view';
    render(current);
  };

  // ── Judge eval: run the judge over every trace and compare to the golden verdicts ──
  var evalMode = false;
  var evalBtn = document.getElementById('toggleEval');
  evalBtn.onclick = function(){
    evalMode = !evalMode;
    evalBtn.classList.toggle('on', evalMode);
    if(evalMode) renderEval(); else { wrap.classList.remove('wide'); render(current); }
  };
  // gold verdict/reason = your saved label, else the trace's suggested one (pass/fail only)
  function goldOf(tr){ return (tr.annotation && tr.annotation.verdict) || (tr.suggested && tr.suggested.verdict) || null; }
  function goldReasonOf(tr){
    var a = tr.annotation || {};
    return a.verdict ? (a.reason||'') : ((tr.suggested && tr.suggested.reason) || '');
  }
  function vcls(v){ return v==='pass' ? 'vpass' : v==='fail' ? 'vfail' : 'vwait'; }

  // ── Mega judge eval: every engine side by side on the same traces vs the golden verdicts ──
  // One row per trace, one narrow column per engine. Scoreboard: agreement (vs the "always
  // fail" baseline), misses, false alarms, time and estimated cost. Click any cell to see
  // exactly what that engine was sent and what it returned. Runs are saved and replayable.
  var escA = function(s){ return esc(s).replace(/"/g,'&quot;'); };
  var ENGINES = null, SELECTED = null, RESULTS = {}, TIMING = {}, REPLAY = null, INSPECT = null;
  var DEFAULT_ON = {baseline:1, laya:1, jev:1};
  function ekey(e){ return e.engine + '|' + (e.model||''); }
  function engByKey(k){ return (ENGINES||[]).filter(function(e){ return ekey(e)===k; })[0]; }

  function renderEval(){
    wrap.classList.add('wide');
    document.getElementById('scTitle').textContent = 'Mega judge eval: every engine vs. the golden set';
    document.getElementById('scIds').textContent = T.length + ' trace(s) · pass/fail vs gold · click a cell to see what the engine saw';
    if(!served){
      wrap.innerHTML = '<div class="empty">Judge eval needs the server — run <code>python3 tools/serve.py</code> and open the localhost URL.</div>';
      return;
    }
    wrap.innerHTML = '<div class="evalhead"><span class="badge">Judge:</span>'
      + '<select class="btn" id="judgeSel"><option>loading…</option></select>'
      + '<button class="btn on" id="runEval">▶ Run selected</button>'
      + '<span class="badge">Replay:</span><select class="btn" id="runSel"><option value="">— live —</option></select>'
      + '<span class="badge" id="evalStatus"></span></div>'
      + '<div class="chips" id="engChips">loading engines…</div>'
      + '<div id="replayNote"></div><div id="scoreboard"></div><div id="megaGrid"></div><div id="inspector"></div>';
    document.getElementById('runEval').onclick = runMega;
    populateJudges();
    populateRuns();
    loadEngines(function(){ drawChips(); drawAll(); });
  }

  function loadEngines(cb){
    if(ENGINES){ cb(); return; }
    fetch('/engines', {cache:'no-store'}).then(function(r){ return r.json(); })
      .then(function(d){ ENGINES = d.engines || []; cb(); })
      .catch(function(){ ENGINES = []; cb(); });
  }

  function drawChips(){
    if(!SELECTED){ SELECTED = {}; ENGINES.forEach(function(e){
      if(DEFAULT_ON[e.engine] || e.model==='claude-sonnet-5') SELECTED[ekey(e)] = true; }); }
    document.getElementById('engChips').innerHTML = ENGINES.map(function(e){
      var k = ekey(e);
      return '<label class="chip' + (SELECTED[k]?' on':'') + '" title="' + escA(e.kind + ' · ' + e.price_note) + '">'
        + '<input type="checkbox" data-k="' + escA(k) + '"' + (SELECTED[k]?' checked':'') + '> '
        + esc(e.label) + ' <span class="kind">' + esc(e.kind) + '</span></label>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#engChips input'), function(cb){
      cb.onchange = function(){ SELECTED[cb.getAttribute('data-k')] = cb.checked; cb.parentNode.classList.toggle('on', cb.checked); drawAll(); };
    });
  }

  function populateRuns(){
    var sel = document.getElementById('runSel'); if(!sel) return;
    fetch('/runs', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
      sel.innerHTML = '<option value="">— live —</option>' + (d.runs||[]).map(function(r){
        return '<option value="' + escA(r.id) + '">' + esc(r.id + ' · ' + (r.engines||[]).length + ' engines') + '</option>'; }).join('');
      if(REPLAY) sel.value = REPLAY.id;
    }).catch(function(){});
    sel.onchange = function(){
      if(!sel.value){ REPLAY = null; RESULTS = {}; TIMING = {}; drawAll(); return; }
      fetch('/runs?id=' + encodeURIComponent(sel.value), {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(run){
        REPLAY = {id: sel.value, saved: run.saved, judge: run.judge};
        RESULTS = run.results || {}; TIMING = run.timing || {};
        (run.engines||[]).forEach(function(e){ if(!engByKey(ekey(e))) ENGINES.push(e); });   // replay engines that are offline now
        SELECTED = {}; (run.engines||[]).forEach(function(e){ SELECTED[ekey(e)] = true; });
        var js = document.getElementById('judgeSel'); if(js && run.judge) js.value = run.judge;
        drawChips(); drawAll();
      });
    };
  }

  function cols(){ return (ENGINES||[]).filter(function(e){ return SELECTED && SELECTED[ekey(e)]; }); }
  function fmtMs(ms){ return ms==null ? '—' : ms < 1000 ? Math.round(ms) + ' ms' : (ms/1000).toFixed(1) + ' s'; }
  function fmtUsd(x){ return x==null ? '—' : x===0 ? '$0' : x < 0.01 ? '$' + x.toFixed(5) : '$' + x.toFixed(x < 1 ? 3 : 2); }
  function median(a){ if(!a.length) return null; a = a.slice().sort(function(x,y){return x-y;}); var m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2; }

  function stats(k){
    var R = RESULTS[k] || {}, s = {n:0, agree:0, miss:0, fa:0, err:0, gfail:0, ms:[], cost:0, tin:0, tout:0};
    T.forEach(function(tr){
      var r = R[tr.trace_id], g = goldOf(tr); if(!r) return;
      if(r.error){ s.err++; return; }
      s.ms.push(r.ms||0); s.cost += r.cost_usd||0; s.tin += r.tokens_in||0; s.tout += r.tokens_out||0;
      if(!g) return;
      s.n++; if(g==='fail') s.gfail++; if(r.verdict===g) s.agree++; else if(g==='fail') s.miss++; else s.fa++;
    });
    return s;
  }

  function drawAll(){ drawScoreboard(); drawGrid(); drawReplayNote(); }

  function drawReplayNote(){
    var el = document.getElementById('replayNote'); if(!el) return;
    el.innerHTML = REPLAY ? '<div class="replay">⏪ Replay of saved run <b>' + esc(REPLAY.id) + '</b> (saved ' + esc(REPLAY.saved||'') + '). Nothing is being re-run; pick "— live —" to run fresh.</div>' : '';
  }

  function drawScoreboard(){
    var el = document.getElementById('scoreboard'); if(!el) return;
    var C = cols(); if(!C.length){ el.innerHTML = '<div class="empty">Tick at least one engine.</div>'; return; }
    var base = stats('baseline|');
    var gtotal = T.filter(function(tr){ return goldOf(tr); }).length;
    var gfail = T.filter(function(tr){ return goldOf(tr)==='fail'; }).length;
    var rows = [
      ['Agreement', function(s){ return s.n ? s.agree + '/' + s.n + ' (' + Math.round(100*s.agree/s.n) + '%)' : '—'; },
        'Traces where the engine\'s pass/fail equals the golden label, out of those with a gold label and a result.'],
      ['vs always-fail', function(s){ if(!s.n) return '—'; var d = s.agree - s.gfail; return (d>0?'+':'') + d; },
        'Agreement minus what a judge that always says "fail" would score on the same traces (' + gfail + '/' + gtotal + ' on the full set). 0 or less = no better than guessing.'],
      ['Missed fails', function(s){ return s.n ? String(s.miss) : '—'; },
        'Gold says FAIL but the engine said pass: the dangerous error (a real violation slips through).'],
      ['False alarms', function(s){ return s.n ? String(s.fa) : '—'; },
        'Gold says PASS but the engine said fail: noise a human has to clear.'],
      ['Total time', function(s, k){ return TIMING[k] ? fmtMs(TIMING[k].wall_ms) : '—'; },
        'Wall-clock from the engine\'s first request to its last answer, with its requests running in parallel Cloud engines send requests in parallel; Laya and the Ollama models share this Mac\'s GPU, so they run one request at a time, one engine after another.'],
      ['Median / trace', function(s){ return fmtMs(median(s.ms)); },
        'Median time for one trace: the full round trip, including Claude Code start-up for Claude.'],
      ['Tokens in / out', function(s){ return s.ms.length ? s.tin.toLocaleString() + ' / ' + s.tout.toLocaleString() : '—'; },
        'Tokens actually sent and returned, as reported by each engine (Claude: minus Claude Code\'s fixed per-call overhead).'],
      ['Est. cost (run)', function(s){ return s.ms.length ? fmtUsd(s.cost) : '—'; },
        'Tokens × list price. Local engines $0 (electricity not counted). Claude = API-equivalent: you pay via Max.'],
      ['Per 1M traces', function(s){ return s.ms.length ? fmtUsd(s.cost / s.ms.length * 1e6) : '—'; },
        'This run\'s cost ÷ traces judged × 1,000,000: what judging a million production conversations would cost at list price.']
    ];
    var head = '<tr><th></th>' + C.map(function(e){ var k=ekey(e), s=stats(k), err = s.err ? ' <span class="vfail" title="errors">⚠' + s.err + '</span>' : '';
      return '<th title="' + escA(e.kind + ' · ' + e.price_note) + '">' + esc(e.label) + err + '</th>'; }).join('') + '</tr>';
    var body = rows.map(function(r){
      return '<tr><td class="sbl" title="' + escA(r[2]) + '">' + esc(r[0]) + ' <span class="q">ⓘ</span></td>' + C.map(function(e){
        var k = ekey(e); return '<td title="' + escA(r[2]) + '">' + esc(r[1](stats(k), k)) + '</td>'; }).join('') + '</tr>';
    }).join('');
    el.innerHTML = '<table class="sb">' + head + body + '</table>';
  }

  function drawGrid(){
    var el = document.getElementById('megaGrid'); if(!el) return;
    var C = cols(); if(!C.length){ el.innerHTML=''; return; }
    var head = '<tr><th>Trace</th><th>Gold</th>' + C.map(function(e){ return '<th>' + esc(e.label) + '</th>'; }).join('') + '</tr>';
    var body = T.map(function(tr){
      var g = goldOf(tr);
      return '<tr><td class="tn" title="' + escA(goldReasonOf(tr)) + '"><b>' + esc(tr.trace_id) + '</b> ' + esc(tr.scenario||'') + '</td>'
        + '<td class="' + vcls(g) + '">' + (g ? g.toUpperCase() : '—') + '</td>'
        + C.map(function(e){
            var k = ekey(e), r = (RESULTS[k]||{})[tr.trace_id], cls = 'mc', txt = '·', tip = 'not run yet: click to preview the request';
            if(r && r.error){ cls += ' err'; txt = '⚠'; tip = r.error; }
            else if(r){ var ok = g ? r.verdict===g : null; cls += ok===true ? ' ok' : ok===false ? ' bad' : '';
              txt = (ok===true?'✓ ':ok===false?'✗ ':'') + (r.verdict==='fail'?'F':'P') + '<span class="ms">' + fmtMs(r.ms) + '</span>';
              tip = r.verdict + ': ' + (r.reason||'') + ' · ' + fmtMs(r.ms); }
            else if(RUNNING[k+'/'+tr.trace_id]){ txt = '…'; tip = 'running'; }
            var sel = INSPECT && INSPECT.k===k && INSPECT.tid===tr.trace_id ? ' sel' : '';
            return '<td class="' + cls + sel + '" data-k="' + escA(k) + '" data-t="' + escA(tr.trace_id) + '" title="' + escA(tip) + '">' + txt + '</td>';
          }).join('') + '</tr>';
    }).join('');
    el.innerHTML = '<table class="mega">' + head + body + '</table>';
    Array.prototype.forEach.call(el.querySelectorAll('td.mc'), function(td){
      td.onclick = function(){ inspect(td.getAttribute('data-k'), td.getAttribute('data-t')); };
    });
  }

  // "What the engine sees": exact request + raw response for one trace × engine
  function inspect(k, tid){
    INSPECT = {k:k, tid:tid}; drawGrid();
    var e = engByKey(k), r = (RESULTS[k]||{})[tid], el = document.getElementById('inspector');
    function show(req){
      el.innerHTML = '<div class="insp"><div class="insph"><b>' + esc(e ? e.label : k) + '</b> on <b>' + esc(tid) + '</b>'
        + (r && !r.error ? ' · ' + esc(r.verdict) + ' · ' + fmtMs(r.ms) + ' · ' + (r.tokens_in||0) + ' tokens in / ' + (r.tokens_out||0) + ' out · ' + fmtUsd(r.cost_usd)
             + (r.api_ms ? ' · API time ' + fmtMs(r.api_ms) : '') : r && r.error ? ' · <span class="vfail">error</span>' : ' · <i>not run yet</i>')
        + '<span class="x" id="inspX">✕</span></div>'
        + '<div class="panes"><div><div class="seclbl">' + (r ? 'What it was sent' : 'What it would be sent') + '</div><pre>' + esc(JSON.stringify(req, null, 2)) + '</pre></div>'
        + '<div><div class="seclbl">What it returned</div><pre>' + esc(r ? (r.error || JSON.stringify(r.response, null, 2)) : '— run this engine to see its answer —') + '</pre>'
        + (r && r.reason ? '<div class="seclbl">Verdict reason</div><pre>' + esc(r.reason) + '</pre>' : '') + '</div></div></div>';
      document.getElementById('inspX').onclick = function(){ INSPECT = null; el.innerHTML = ''; drawGrid(); };
      el.scrollIntoView({behavior:'smooth', block:'nearest'});
    }
    if(r && r.request){ show(r.request); return; }
    var jsel = document.getElementById('judgeSel'), parts = k.split('|');
    fetch('/request?' + (currentSource ? 'source=' + encodeURIComponent(currentSource) + '&' : '') + 'trace=' + encodeURIComponent(tid)
          + '&engine=' + encodeURIComponent(parts[0]) + (parts[1] ? '&model=' + encodeURIComponent(parts[1]) : '')
          + '&judge=' + encodeURIComponent((jsel && jsel.value) || 'safety'), {cache:'no-store'})
      .then(function(x){ return x.json(); }).then(function(d){ show(d.request || d); }).catch(function(err){ show({error: String(err)}); });
  }

  // Fill the judge dropdown from /judges (safety, tone, …). Cached after first load.
  var JUDGES = null;
  function populateJudges(){
    var sel = document.getElementById('judgeSel'); if(!sel) return;
    function fill(list){
      sel.innerHTML = (list && list.length ? list : ['safety'])
        .map(function(j){ return '<option value="' + esc(j) + '">' + esc(j.charAt(0).toUpperCase() + j.slice(1)) + '</option>'; })
        .join('');
      if(REPLAY && REPLAY.judge) sel.value = REPLAY.judge;
    }
    sel.onchange = function(){ if(!REPLAY){ RESULTS = {}; TIMING = {}; drawAll(); } };
    if(JUDGES){ fill(JUDGES); return; }
    fetch('/judges', {cache:'no-store'}).then(function(r){ return r.json(); })
      .then(function(d){ JUDGES = d.judges || []; fill(JUDGES); })
      .catch(function(){ fill(null); });
  }

  // Run every selected engine. Cloud engines get their own lanes (Jev 8, each Claude model 4
  // in parallel); Laya and ALL Ollama models share one local lane, one request at a time.
  var RUNNING = {};
  function runMega(){
    var C = cols().slice().sort(function(a, b){ return (a.engine==='laya' ? 0 : 1) - (b.engine==='laya' ? 0 : 1); });
    if(!C.length) return;
    var btn = document.getElementById('runEval'), status = document.getElementById('evalStatus');
    var judgeName = (document.getElementById('judgeSel')||{}).value || 'safety';
    REPLAY = null; var rs = document.getElementById('runSel'); if(rs) rs.value = '';
    RESULTS = {}; TIMING = {}; RUNNING = {}; drawAll();
    btn.disabled = true; btn.textContent = 'Running…';
    var t0 = performance.now(), lanes = {}, pending = 0;
    C.forEach(function(e){
      // Laya + every Ollama model share ONE local lane, one request at a time: they all use this
      // Mac's GPU, so running them together slows each other down (unfair timing) and can crash
      // Laya's Metal backend. Laya is queued first. Cloud engines (Jev, Claude) run in parallel.
      var local = e.engine === 'laya' || e.engine.indexOf('ollama') === 0;
      var lane = local ? 'local' : ekey(e);
      var conc = local ? 1 : ({jev:8, claude:4, baseline:20}[e.engine] || 4);
      lanes[lane] = lanes[lane] || {conc: conc, queue: []};
      T.forEach(function(tr){ lanes[lane].queue.push({e:e, tr:tr}); pending++; });
    });
    function tick(){ status.textContent = (C.length*T.length - pending) + '/' + (C.length*T.length) + ' judged · ' + ((performance.now()-t0)/1000).toFixed(1) + ' s'; }
    function finishOne(){
      pending--; tick(); drawAll();
      if(pending === 0){
        btn.disabled = false; btn.textContent = '▶ Re-run selected';
        status.textContent = 'done in ' + ((performance.now()-t0)/1000).toFixed(1) + ' s · saving…';
        fetch('/runs', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({judge: judgeName, source: currentSource, engines: C, results: RESULTS, timing: TIMING})})
          .then(function(r){ return r.json(); }).then(function(d){ status.textContent = 'done in ' + ((performance.now()-t0)/1000).toFixed(1) + ' s · saved as ' + d.id; populateRuns(); })
          .catch(function(){ status.textContent += ' (not saved)'; });
      }
    }
    function worker(lane){
      var job = lanes[lane].queue.shift(); if(!job) return;
      var e = job.e, tr = job.tr, k = ekey(e);
      TIMING[k] = TIMING[k] || {start: performance.now()};
      RUNNING[k+'/'+tr.trace_id] = 1; drawGrid();
      var u = '/judge?' + (currentSource ? 'source=' + encodeURIComponent(currentSource) + '&' : '') + 'trace=' + encodeURIComponent(tr.trace_id)
            + '&engine=' + encodeURIComponent(e.engine) + (e.model ? '&model=' + encodeURIComponent(e.model) : '') + '&judge=' + encodeURIComponent(judgeName);
      fetch(u, {cache:'no-store'}).then(function(r){ return r.json(); })
        .then(function(res){ (RESULTS[k] = RESULTS[k] || {})[tr.trace_id] = res.error ? {error: res.error} : res; })
        .catch(function(err){ (RESULTS[k] = RESULTS[k] || {})[tr.trace_id] = {error: String(err)}; })
        .then(function(){
          delete RUNNING[k+'/'+tr.trace_id];
          TIMING[k].wall_ms = performance.now() - TIMING[k].start;
          finishOne(); worker(lane);
        });
    }
    tick();
    Object.keys(lanes).forEach(function(l){ for(var i=0;i<lanes[l].conc;i++) worker(l); });
  }

  // In patient view, hide everything that isn't the conversation itself.
  function visibleEvents(tr){
    var evs = tr.events || [];
    if(!patientView) return evs;
    return evs.filter(function(e){ return e.type === 'user' || e.type === 'assistant' || e.type === 'human'; });
  }

  // tags shown for a trace: your saved/edited tags if any, else the auto tags from the trace
  function tagsFor(tr){
    var a = tr.annotation || {};
    if(a.tags && a.tags.length) return a.tags.slice();
    return (tr.outcome && tr.outcome.tags || []).slice();
  }
  function tagSpans(arr){
    return (arr||[]).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('');
  }

  function verdotSym(v){ return v==='pass' ? '✓' : v==='fail' ? '✗' : '○'; }
  function verdotHTML(tr){
    var v = (tr.annotation && tr.annotation.verdict) || null;
    return '<span class="verdot ' + (v||'none') + '" id="dot-' + esc(tr.trace_id) + '">' + verdotSym(v) + '</span>';
  }
  function updateDot(tr){
    var el = document.getElementById('dot-' + tr.trace_id); if(!el) return;
    var v = (tr.annotation && tr.annotation.verdict) || null;
    el.className = 'verdot ' + (v||'none'); el.textContent = verdotSym(v);
  }

  function labelBarHTML(tr){
    if(!served) return '<div class="label-bar"><span class="lbl">Labeling needs the server</span> — run <code>python3 tools/serve.py --dir &lt;folder&gt;</code> and open the localhost URL.</div>';
    var a = tr.annotation || {}; var sg = tr.suggested;
    var h = '<div class="label-bar"><div class="lrow"><span class="lbl">Your verdict</span>'
      + '<button class="lb pass" id="lbPass">Pass</button>'
      + '<button class="lb fail" id="lbFail">Fail</button>'
      + '<button class="btn" id="lbClear">Clear</button>'
      + '<button class="btn save" id="lbSave">Save label</button>'
      + '<span class="status" id="labelStatus">' + (a.verdict ? ('saved · ' + a.verdict.toUpperCase()) : 'unlabeled') + '</span></div>'
      + '<textarea id="reasonBox" placeholder="Why does this pass or fail? (your reasoning becomes the eval rationale)">' + esc(a.reason||'') + '</textarea>'
      + '<div class="lrow" style="margin-top:10px"><span class="lbl">Tags</span>'
      + '<span id="tagChips"></span>'
      + '<input id="tagInput" class="taginput" placeholder="add tag + Enter"></div>';
    if(sg){ h += '<div class="suggest">💡 Suggested: <b>' + esc(String(sg.verdict||'').toUpperCase()) + '</b> — ' + esc(sg.reason||'') + ' &nbsp;<span class="link" id="lbAccept">use this</span></div>'; }
    return h + '</div>';
  }

  function wireLabeling(tr){
    var pass=document.getElementById('lbPass'), fail=document.getElementById('lbFail');
    if(!pass) return;
    var save=document.getElementById('lbSave'), clear=document.getElementById('lbClear');
    var reason=document.getElementById('reasonBox'), status=document.getElementById('labelStatus');
    var accept=document.getElementById('lbAccept');
    var chips=document.getElementById('tagChips'), tagInput=document.getElementById('tagInput');
    var pending = (tr.annotation && tr.annotation.verdict) || null;
    var tags = tagsFor(tr);                        // start from saved tags, else the auto tags
    function sel(){ pass.classList.toggle('sel', pending==='pass'); fail.classList.toggle('sel', pending==='fail'); }
    function renderChips(){
      chips.innerHTML = tags.map(function(t,k){
        return '<span class="tag edit">'+esc(t)+'<span class="tagx" data-k="'+k+'">×</span></span>'; }).join('');
      Array.prototype.forEach.call(chips.querySelectorAll('.tagx'), function(x){
        x.onclick = function(){ tags.splice(+x.getAttribute('data-k'),1); renderChips(); };
      });
    }
    function addTag(){
      var v=(tagInput.value||'').trim();
      if(v && tags.indexOf(v)<0) tags.push(v);
      tagInput.value=''; renderChips();
    }
    function doSave(verdict, txt, tagList){
      status.textContent = 'saving…';
      fetch('/annotate' + srcQuery(), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trace_id:tr.trace_id, verdict:verdict, reason:txt, tags:tagList})})
        .then(function(r){ return r.json(); })
        .then(function(res){
          tr.annotation = res.annotation || {verdict:verdict, reason:txt, tags:tagList||[]};
          status.textContent = verdict ? ('saved · ' + verdict.toUpperCase())
                             : ((txt || (tagList && tagList.length)) ? 'saved' : 'cleared');
          updateDot(tr);
          var st=document.getElementById('sidetags-'+tr.trace_id); if(st) st.innerHTML = tagSpans(tagsFor(tr));
        })
        .catch(function(e){ status.textContent = 'error: ' + e; });
    }
    sel(); renderChips();
    pass.onclick = function(){ pending='pass'; sel(); };
    fail.onclick = function(){ pending='fail'; sel(); };
    tagInput.onkeydown = function(e){ if(e.key==='Enter'){ e.preventDefault(); addTag(); } };
    if(accept) accept.onclick = function(){ pending = tr.suggested.verdict; reason.value = tr.suggested.reason || ''; sel(); };
    clear.onclick = function(){ pending=null; reason.value=''; tags=(tr.outcome&&tr.outcome.tags||[]).slice(); renderChips(); sel(); doSave(null, '', []); };
    save.onclick = function(){ addTag(); doSave(pending, reason.value, tags); };
  }

  function render(tr){
    current = tr;
    document.getElementById('scTitle').textContent = tr.scenario;
    document.getElementById('scIds').textContent = tr.trace_id + ' · ' + tr.channel + ' · ' + tr.model + ' · started ' + tr.started_at;
    if(rawMode){ wrap.innerHTML = '<pre>' + esc(JSON.stringify(tr,null,2)) + '</pre>'; return; }
    var h = '';
    if(!patientView){
      h += labelBarHTML(tr);
      var c = tr.context || {};
      h += '<div class="context"><div class="lbl">Context</div><div>' + esc(c.summary||'') + '</div>'
        + '<div style="margin-top:8px;font-size:13px;color:var(--muted)">Tools used: '
        + ((tr.outcome && tr.outcome.tools_used || []).map(esc).join(', ') || 'none') + '</div></div>';
    }
    visibleEvents(tr).forEach(function(e){ h += renderEvent(e); });
    wrap.innerHTML = h;
    if(!patientView){ wireLabeling(tr); }
  }

  function renderEvent(e){
    if(e.type==='system'){
      var cls = e.kind==='handoff' ? 'sys handoff' : 'sys';
      return '<div class="'+cls+'">' + esc(e.text) + (e.t?(' · '+timeOnly(e.t)):'') + '</div>';
    }
    if(e.type==='tool_call'){
      return '<div class="ev"><div class="ts">'+timeOnly(e.t)+'</div>'
        + '<details class="tool"><summary><span class="fn">'+esc(e.name)+'</span><span>call</span></summary>'
        + '<div class="body"><div class="seclbl">arguments</div><pre>'+esc(JSON.stringify(e.args,null,2))+'</pre></div></details></div>';
    }
    if(e.type==='tool_result'){
      return '<div class="ev"><div class="ts">'+timeOnly(e.t)+'</div>'
        + '<details class="tool"><summary><span class="dot"></span><span class="fn">'+esc(e.name)+'</span><span>result</span><span class="lat">'+(e.status||'')+' · '+e.latency_ms+'ms</span></summary>'
        + '<div class="body"><div class="seclbl">returned</div><pre>'+esc(JSON.stringify(e.result,null,2))+'</pre></div></details></div>';
    }
    if(e.type==='human'){
      return '<div class="ev"><div class="ts">'+timeOnly(e.t)+'</div>'
        + '<div class="bubble b-human"><div class="role"><span>👤 '+esc(e.name)+' · '+esc(e.role)+'</span></div>'+md(e.text)+'</div></div>';
    }
    if(e.type==='user'){
      return '<div class="ev"><div class="ts">'+timeOnly(e.t)+'</div>'
        + '<div class="bubble b-user"><div class="role"><span>Patient</span></div>'+md(e.text)+'</div></div>';
    }
    return '<div class="ev"><div class="ts">'+timeOnly(e.t)+'</div>'
      + '<div class="bubble b-asst"><div class="role"><span>Avana</span></div>'+md(e.text)+'</div></div>';
  }

  render(current);
  } // end start()

  initSources();
})();
</script>
